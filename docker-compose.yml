services:
  # ============ 入口：Nginx（门户页 + API 反代 + SSE 优化） ============
  nginx:
    image: nginx:1.27-alpine
    container_name: relay-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - new-api

  # ============ 网关：New API（鉴权/路由/限流/计费/管理后台） ============
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    depends_on:
      - mysql
      - redis
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Shanghai
      - SQL_DSN=root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/new-api
      - REDIS_CONN_STRING=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ./data:/data
      - ./logs:/app/logs

  # ============ 网页客户端：ChatGPT-Next-Web ============
  chat:
    image: yidadaa/chatgpt-next-web:latest
    container_name: relay-chat
    restart: always
    depends_on:
      - new-api
    ports:
      - "8080:3000"
    environment:
      - BASE_URL=http://localhost:3000   # 默认 API 地址（外部访问改为 http://<主机IP>:3000）
      - CODE=relay2026                    # 客户端访问码，部署后务必修改

  # ============ 存储：MySQL（账本）+ Redis（缓存/限流） ============
  mysql:
    image: mysql:8.2
    container_name: new-api-mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=new-api
    volumes:
      - ./data/mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: new-api-redis
    restart: always

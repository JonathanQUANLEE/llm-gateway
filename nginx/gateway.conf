# LLM 中转站 —— Nginx 入口配置
# 作用：1) 落地页（模型价格/接入教程） 2) API 反向代理（SSE 流式优化）
# 部署形态：容器模式（docker-compose 内的 relay-nginx）

server {
    listen 80;
    server_name _;

    # 长 prompt 场景请求体上限
    client_max_body_size 20m;

    # 客户端级限流示例（按 IP，每秒 10 请求、突发 20）：
    # limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

    # ============ API 入口（对客户统一暴露） ============
    location /v1/ {
        # limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://new-api:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ---- SSE 流式关键配置 ----
        proxy_set_header Connection "";
        proxy_buffering off;            # 禁止缓冲：生成一个 token 发一个
        proxy_cache off;
        proxy_read_timeout 300s;        # 长回答不被中途掐断
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ============ 落地页（模型价格 / 接入教程 / FAQ） ============
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
